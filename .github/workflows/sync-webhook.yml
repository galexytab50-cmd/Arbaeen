name: Sync Telegram Webhook

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret presence (does not reveal the value)
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN is EMPTY or NOT SET"
          else
            echo "BOT_TOKEN is set, length: ${#BOT_TOKEN}"
          fi
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "WEBHOOK_SECRET is EMPTY or NOT SET"
          else
            echo "WEBHOOK_SECRET is set, length: ${#WEBHOOK_SECRET}"
          fi
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

      - name: Wait for Cloudflare deploy to finish
        run: sleep 45

      - name: Set Telegram webhook
        run: |
          curl -f -X GET "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://ravi.galexytab50.workers.dev/api/telegram-webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
