# این فایل الان ضروریه و باید commit بشه (برخلاف قبل).
# «name» رو با اسم دقیق پروژه‌ای که تو داشبورد Cloudflare ساختی یکی کن
# (تو لاگ آخرت این‌طور مشخص بود: arbaeen). اگه اسم پروژه‌ت چیز دیگه‌ایه، همینجا عوضش کن.
name = "arbaeen"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# بعد از ساختن KV Namespace به اسم POSTS (از داشبورد Cloudflare یا با
# `wrangler kv namespace create POSTS`)، آیدی‌ش رو اینجا جایگزین کن.
[[kv_namespaces]]
binding = "POSTS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
